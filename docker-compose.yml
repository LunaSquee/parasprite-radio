services:
  icecast:
    image: pltnk/icecast2
    ports:
      - 8000:8000
    volumes:
      - ./docker/icecast.xml:/etc/icecast2/icecast.xml
    networks:
      - parasprite
  mpd:
    image: gists/mpd
    ports:
      - 8800:8000
      - 6600:6600
    volumes:
      - ./docker/music:/music
      - ./docker/playlists:/var/lib/mpd/playlists
    networks:
      - parasprite
  mysql:
    # MariaDB: the old "mysql" npm driver can't authenticate against MySQL 8+
    image: mariadb:11.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=P4raspriteRadio13ROOT
      - MYSQL_PASSWORD=P4raspriteRadio13
      - MYSQL_DATABASE=paraspriteradio
      - MYSQL_USER=paraspriteradio
    volumes:
      - ./docker/database:/var/lib/mysql
    networks:
      - parasprite
  liquidsoap:
    build:
      context: ./docker/liquidsoap
    # run as the host user so recordings in ./archive are writable
    user: "${LIQ_UID:-1000}:${LIQ_GID:-1000}"
    # append "--", "dev" to run in dev mode (HLS only, no icecast)
    command: ["radio.liq"]
    restart: unless-stopped
    depends_on:
      - icecast
    ports:
      - 7004:7004
      - 7005:7005
      - 7006:7006
    volumes:
      - .:/app
      - ./docker/music:/music:ro
      - ./docker/playlists:/data/audio/playlists:ro
      # HLS output, served by the web server
      - ./docker/streams:/tmp/pr/streams
    networks:
      - parasprite
  server:
    build:
      context: .
      dockerfile: docker/server/Dockerfile
    restart: unless-stopped
    # create/upgrade the database schema, then start the web server
    command: ["sh", "-c", "node_modules/.bin/knex migrate:latest && exec node bin/startserver"]
    depends_on:
      mysql:
        condition: service_healthy
      liquidsoap:
        condition: service_started
      mpd:
        condition: service_started
    ports:
      - 8002:8002
    volumes:
      - ./conf:/app/conf:ro
      - ./docker/music:/music:ro
      - ./docker/streams:/tmp/pr/streams
    networks:
      - parasprite

networks:
  parasprite:
